<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>售前工具中心</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
  /* ===== 基础重置 ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--scrollbar);
    border-radius: 8px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  body {
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }

  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-deep: #0F172A;
    --bg-sidebar: #131C31;
    --bg-card: #1E293B;
    --bg-card-hover: #273449;
    --bg-active: rgba(56, 189, 248, 0.12);
    --text-primary: #F1F5F9;
    --text-secondary: #A9B6C9;
    --text-muted: #7C8AA0;
    --border-subtle: #334155;
    --border-hover: #475569;
    --accent-wire: #F59E0B;
    --accent-size: #38BDF8;
    --accent-struct: #34D399;
    --accent-acc: #A78BFA;
    --accent-nonstd: #F472B6;
    --accent-wiring: #2DD4BF;
    --sidebar-width: 216px;
    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.28);
    --scrollbar: #334155;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg-deep: #EFF4FB;
    --bg-sidebar: #FFFFFF;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F3F7FC;
    --bg-active: rgba(14, 165, 233, 0.10);
    --text-primary: #12263F;
    --text-secondary: #3E4E64;
    --text-muted: #6E7E93;
    --border-subtle: #E3EAF3;
    --border-hover: #CBD8E8;
    --accent-wire: #D97706;
    --accent-size: #0EA5E9;
    --accent-struct: #10B981;
    --accent-acc: #7C5CE0;
    --accent-nonstd: #DB2777;
    --accent-wiring: #0DA7A0;
    --sidebar-width: 216px;
    --shadow-card: 0 4px 18px rgba(15, 23, 42, 0.06);
    --scrollbar: #CBD8E8;
  }

  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-text-size-adjust: 100%;
    font-synthesis-weight: none;
    overflow: hidden;
  }

  /* ===== 整体布局 ===== */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
  }

  /* ===== 顶部品牌栏 ===== */
  .top-bar {
    height: 56px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: color-mix(in srgb, var(--bg-sidebar) 82%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    flex-shrink: 0;
    position: relative;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .brand-logo svg {
    width: 96px;
    height: 32px;
    display: block;
    /* 字标颜色随主题：浅色深字、深色白字；橙环固定 brand 橙 */
    color: var(--text-primary);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ===== 主区域 ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-deep);
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .action-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  .action-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
  }

  /* 主题切换（顶部按钮） */
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  .theme-toggle svg {
    width: 15px;
    height: 15px;
    stroke: var(--accent-size);
  }

  /* 内容区域 */
  .content-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* 欢迎首页 */
  .welcome-page {
    position: absolute;
    inset: 0;
    background: var(--bg-deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow-y: auto;
    z-index: 5;
  }

  .welcome-page.hidden {
    display: none;
  }

  .welcome-hero {
    text-align: center;
    margin-bottom: 40px;
  }

  .welcome-hero .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(231, 129, 49, 0.1);
    border: 1px solid rgba(231, 129, 49, 0.22);
    font-size: 12px;
    font-weight: 500;
    color: #E78131;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }

  .welcome-hero .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #E78131;
    box-shadow: 0 0 8px rgba(231, 129, 49, 0.8);
    animation: pulse 2s ease-in-out infinite;
  }

  .welcome-hero h2 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .welcome-hero h2 .gradient {
    color: #E78131;
  }

  .welcome-hero p {
    font-size: 15px;
    color: var(--text-secondary);
    font-weight: 400;
    line-height: 1.7;
    max-width: 520px;
    margin: 0 auto;
    letter-spacing: 0.01em;
  }

  .welcome-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 720px;
    width: 100%;
  }

  .welcome-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 22px 20px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
  }

  .welcome-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(140px 90px at var(--mx, 50%) var(--my, 50%), rgba(56, 189, 248, 0.12), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .welcome-card:hover::after { opacity: 1; }

  .welcome-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: var(--shadow-card), 0 10px 26px rgba(56, 189, 248, 0.10);
  }

  .welcome-card .wc-go {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-active);
    color: var(--accent-size);
    opacity: 0;
    transition: all 0.25s ease;
  }

  .welcome-card .wc-go svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
  }

  .welcome-card:hover .wc-go {
    opacity: 1;
    right: 12px;
  }

  .welcome-card .wc-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .welcome-card .wc-icon svg {
    width: 20px;
    height: 20px;
  }

  .welcome-card h3 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 6px;
  }

  .welcome-card p {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    line-height: 1.55;
  }

  .welcome-card.wire .wc-icon { background: rgba(245, 158, 11, 0.12); }
  .welcome-card.wire .wc-icon svg { stroke: var(--accent-wire); }
  .welcome-card.size .wc-icon { background: rgba(56, 189, 248, 0.12); }
  .welcome-card.size .wc-icon svg { stroke: var(--accent-size); }
  .welcome-card.struct .wc-icon { background: rgba(52, 211, 153, 0.12); }
  .welcome-card.struct .wc-icon svg { stroke: var(--accent-struct); }
  .welcome-card.acc .wc-icon { background: rgba(167, 139, 250, 0.12); }
  .welcome-card.acc .wc-icon svg { stroke: var(--accent-acc); }
  .welcome-card.nonstd .wc-icon { background: rgba(244, 114, 182, 0.12); }
  .welcome-card.nonstd .wc-icon svg { stroke: var(--accent-nonstd); }
  .welcome-card.wiring .wc-icon { background: rgba(45, 212, 191, 0.12); }
  .welcome-card.wiring .wc-icon svg { stroke: var(--accent-wiring); }

  .welcome-footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.8;
  }

  /* iframe 容器 */
  .iframe-container {
    position: absolute;
    inset: 0;
    background: var(--bg-deep);
    overflow: hidden;
  }

  .iframe-container.hidden {
    display: none;
  }

  .iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* 加载遮罩 */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg-deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    transition: opacity 0.3s ease;
  }

  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border-subtle);
    border-top-color: var(--accent-size);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .app {
      flex-direction: column;
    }

    .top-bar {
      height: 52px;
      padding: 0 14px;
    }

    .brand-logo svg {
      width: 84px;
      height: 28px;
    }

    .theme-toggle .tt-label {
      display: none;
    }

    .welcome-page {
      padding: 24px 16px;
    }

    .welcome-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .welcome-card {
      padding: 16px 14px;
    }

    .welcome-hero h2 {
      font-size: 24px;
    }
  }

  /* ===== 减少动效 ===== */
  @media (prefers-reduced-motion: reduce) {
    .action-btn, .loading-overlay, .welcome-card {
      transition: none;
      animation: none;
    }
    .spinner { animation: none; }
  }
</style>
</head>

  <!-- ===== 主区域 ===== -->
  <main class="main">


    <div class="content-area">
      <!-- 欢迎首页 -->
      <div class="welcome-page" id="welcomePage">
        <div class="welcome-hero">
          <div class="badge"><span class="dot"></span>Pre-Sales Toolkit</div>

          <p>六大核心工具一站式汇聚<br>点选任意卡片即可开始使用</p>

<script>
  (function() {
    const iframe = document.getElementById('toolFrame');
    const iframeContainer = document.getElementById('iframeContainer');
    const welcomePage = document.getElementById('welcomePage');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const openNewTab = document.getElementById('openNewTab');
    const refreshBtn = document.getElementById('refreshBtn');
    const homeBtn = document.getElementById('homeBtn');
    /* 主题切换相关 */
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    let currentUrl = '';

    // ===== 主题切换（仅浅色 / 深色两态）=====
    const THEME_KEY = 'pstc-theme';
    const THEME_ORDER = ['light', 'dark'];
    const THEME_LABEL = { light: '浅色', dark: '深色' };

    function applyTheme() {
      let pref = localStorage.getItem(THEME_KEY) || 'light';
      if (THEME_ORDER.indexOf(pref) === -1) pref = 'light';
      const resolved = pref;
      document.documentElement.setAttribute('data-theme', resolved);
      if (themeLabel) themeLabel.textContent = THEME_LABEL[pref];
    }

    function cycleTheme() {
      const current = localStorage.getItem(THEME_KEY) || 'light';
      const idx = THEME_ORDER.indexOf(current) === -1 ? 0 : THEME_ORDER.indexOf(current);
      const next = THEME_ORDER[(idx + 1) % THEME_ORDER.length];
      localStorage.setItem(THEME_KEY, next);
      applyTheme();
    }

    if (themeToggle) themeToggle.addEventListener('click', cycleTheme);
    applyTheme();

    // ===== 工具切换 =====
    function showTool(url, name) {
      currentUrl = url;
      openNewTab.href = url;
      welcomePage.classList.add('hidden');
      iframeContainer.classList.remove('hidden');
      refreshBtn.style.display = 'inline-flex';
      openNewTab.style.display = 'inline-flex';
      loadingOverlay.classList.remove('hidden');
      iframe.src = url;
    }

    function showHome() {
      welcomePage.classList.remove('hidden');
      iframeContainer.classList.add('hidden');
      refreshBtn.style.display = 'none';
      openNewTab.style.display = 'none';
      iframe.src = '';
      currentUrl = '';
    }

    // 欢迎页工具卡片点击
    const welcomeCards = document.querySelectorAll('.welcome-card');
    welcomeCards.forEach(function(card) {
      card.addEventListener('click', function() {
        showTool(card.dataset.url, card.dataset.name);
      });
      // 卡片鼠标光斑跟随
      card.addEventListener('mousemove', function(e) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
      });
    });

    homeBtn.addEventListener('click', showHome);

    iframe.addEventListener('load', function() {
      if (iframe.src) loadingOverlay.classList.add('hidden');
    });

    // 5秒后强制隐藏加载遮罩
    setTimeout(function() {
      loadingOverlay.classList.add('hidden');
    }, 5000);

    refreshBtn.addEventListener('click', function() {
      if (!currentUrl) return;
      loadingOverlay.classList.remove('hidden');
      iframe.src = currentUrl;
      setTimeout(function() { loadingOverlay.classList.add('hidden'); }, 3000);
    });
  })();
</script>
