<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED 售前工具中心</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
  /* ===== 基础重置 ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0F172A;
    --bg-sidebar: #131C31;
    --bg-card: #1E293B;
    --bg-card-hover: #273449;
    --bg-active: rgba(56, 189, 248, 0.12);
    --text-primary: #F1F5F9;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --border-subtle: #334155;
    --border-hover: #475569;
    --accent-wire: #F59E0B;
    --accent-size: #38BDF8;
    --accent-struct: #34D399;
    --accent-acc: #A78BFA;
    --accent-nonstd: #F472B6;
    --accent-wiring: #2DD4BF;
    --sidebar-width: 240px;
  }

  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ===== 整体布局 ===== */
  .app {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  /* ===== 左侧边栏 ===== */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .sidebar-header .logo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-size);
    box-shadow: 0 0 10px var(--accent-size);
    display: inline-block;
    margin-right: 8px;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .sidebar-header .brand {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
  }

  .sidebar-header h1 {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .sidebar-header h1 .accent { color: var(--accent-size); }

  .sidebar-header .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.5;
    font-weight: 300;
  }

  /* 导航列表 */
  .nav-list {
    list-style: none;
    padding: 12px 12px;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 4px;
    border: 1px solid transparent;
    position: relative;
  }

  .nav-item:hover {
    background: var(--bg-card);
    border-color: var(--border-subtle);
  }

  .nav-item.active {
    background: var(--bg-active);
    border-color: rgba(56, 189, 248, 0.25);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    border-radius: 0 3px 3px 0;
    background: var(--accent-size);
  }

  .nav-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-icon svg {
    width: 18px;
    height: 18px;
  }

  .nav-item.wire .nav-icon { background: rgba(245, 158, 11, 0.12); }
  .nav-item.wire .nav-icon svg { stroke: var(--accent-wire); }
  .nav-item.size .nav-icon { background: rgba(56, 189, 248, 0.12); }
  .nav-item.size .nav-icon svg { stroke: var(--accent-size); }
  .nav-item.struct .nav-icon { background: rgba(52, 211, 153, 0.12); }
  .nav-item.struct .nav-icon svg { stroke: var(--accent-struct); }
  .nav-item.acc .nav-icon { background: rgba(167, 139, 250, 0.12); }
  .nav-item.acc .nav-icon svg { stroke: var(--accent-acc); }
  .nav-item.nonstd .nav-icon { background: rgba(244, 114, 182, 0.12); }
  .nav-item.nonstd .nav-icon svg { stroke: var(--accent-nonstd); }
  .nav-item.wiring .nav-icon { background: rgba(45, 212, 191, 0.12); }
  .nav-item.wiring .nav-icon svg { stroke: var(--accent-wiring); }

  .nav-info {
    flex: 1;
    min-width: 0;
  }

  .nav-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nav-desc {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nav-item.active .nav-name { color: var(--accent-size); }

  /* 边栏底部 */
  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
    line-height: 1.6;
  }

  /* ===== 右侧主区域 ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-deep);
  }

  .main-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-sidebar);
    flex-shrink: 0;
  }

  .main-title {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .main-title .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-struct);
    box-shadow: 0 0 6px var(--accent-struct);
  }

  .main-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .action-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  .action-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
  }

  /* iframe 容器 */
  .iframe-container {
    flex: 1;
    position: relative;
    background: #fff;
    overflow: hidden;
  }

  .iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* 加载遮罩 */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg-deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    transition: opacity 0.3s ease;
  }

  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border-subtle);
    border-top-color: var(--accent-size);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .app {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      min-width: 100%;
      max-height: 50vh;
      border-right: none;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-header {
      padding: 16px 16px 14px;
    }

    .nav-list {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .nav-item {
      flex-shrink: 0;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      margin-bottom: 0;
      min-width: 90px;
      text-align: center;
    }

    .nav-item.active::before {
      display: none;
    }

    .nav-icon {
      width: 32px;
      height: 32px;
    }

    .nav-info {
      text-align: center;
    }

    .nav-desc {
      display: none;
    }

    .nav-name {
      font-size: 12px;
    }

    .sidebar-footer {
      display: none;
    }

    .main-header {
      padding: 10px 16px;
    }

    .main-title {
      font-size: 13px;
    }
  }

  /* ===== 减少动效 ===== */
  @media (prefers-reduced-motion: reduce) {
    .nav-item, .action-btn, .loading-overlay {
      transition: none;
      animation: none;
    }
    .spinner { animation: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===== 左侧边栏 ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="logo-dot"></span>Pre-Sales Toolkit</div>
      <h1>售前工具<span class="accent">中心</span></h1>
      <p class="subtitle">六大工具一站式访问，点击左侧切换</p>
    </div>

    <ul class="nav-list" id="navList">
      <li class="nav-item wire active" data-url="https://abspresales.github.io/wire-cable/" data-name="标准线材速查">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4v6a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V4"/>
            <path d="M4 20v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>
            <circle cx="8" cy="4" r="1.5"/>
            <circle cx="16" cy="4" r="1.5"/>
            <circle cx="8" cy="20" r="1.5"/>
            <circle cx="16" cy="20" r="1.5"/>
          </svg>
        </div>
        <div class="nav-info">
          <div class="nav-name">标准线材速查</div>
          <div class="nav-desc">线材规格 · SAP料号</div>
        </div>
      </li>

      <li class="nav-item size" data-url="https://abspresales.github.io/estimated-dimensions/" data-name="预估尺寸速算">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18"/>
            <path d="M9 3v18"/>
            <path d="M15 3v18"/>
            <path d="M3 15h18"/>
          </svg>
        </div>
        <div class="nav-info">
          <div class="nav-name">预估尺寸速算</div>
          <div class="nav-desc">重量体积 · 货柜估算</div>
        </div>
      </li>

      <li class="nav-item struct" data-url="https://abspresales.github.io/structural-sfittings/" data-name="结构配件速算">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="nav-info">
          <div class="nav-name">结构配件速算</div>
          <div class="nav-desc">挂架背条 · 包边支撑</div>
        </div>
      </li>

      <li class="nav-item acc" data-url="https://abspresales.github.io/common-accessories/" data-name="常用配件速查">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div class="nav-info">
          <div class="nav-name">常用配件速查</div>
          <div class="nav-desc">配件规格 · 料号定位</div>
        </div>
      </li>

      <li class="nav-item nonstd" data-url="https://abspresales.github.io/Non-standard-Solution/" data-name="非标方案统计表">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div class="nav-info">
          <div class="nav-name">非标方案统计表</div>
          <div class="nav-desc">定制方案 · 特殊场景</div>
        </div>
      </li>

      <li class="nav-item wiring" data-url="https://abspresales.github.io/wiring-diagram" data-name="布线图纸生成器">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <path d="M10 6.5h4"/>
            <path d="M6.5 10v4"/>
            <path d="M17.5 10v4"/>
            <path d="M10 17.5h4"/>
          </svg>
        </div>
        <div class="nav-info">
          <div class="nav-name">布线图纸生成器</div>
          <div class="nav-desc">网线级联 · 电源分布</div>
        </div>
      </li>
    </ul>

    <div class="sidebar-footer">
      成功是基于达成目标<br>速度和效率是制胜的关键
    </div>
  </aside>

  <!-- ===== 右侧主区域 ===== -->
  <main class="main">
    <div class="main-header">
      <div class="main-title">
        <span class="status-dot"></span>
        <span id="currentToolName">标准线材速查</span>
      </div>
      <div class="main-actions">
        <button class="action-btn" id="refreshBtn" title="刷新当前工具">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          刷新
        </button>
        <a class="action-btn" id="openNewTab" href="https://abspresales.github.io/wire-cable/" target="_blank" rel="noopener noreferrer" title="在新标签页打开">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          新窗口打开
        </a>
      </div>
    </div>

    <div class="iframe-container">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">正在加载工具...</div>
      </div>
      <iframe id="toolFrame" src="https://abspresales.github.io/wire-cable/" title="LED售前工具"></iframe>
    </div>
  </main>

</div>

<script>
  (function() {
    const navItems = document.querySelectorAll('.nav-item');
    const iframe = document.getElementById('toolFrame');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const currentToolName = document.getElementById('currentToolName');
    const openNewTab = document.getElementById('openNewTab');
    const refreshBtn = document.getElementById('refreshBtn');
    let currentUrl = 'https://abspresales.github.io/wire-cable/';

    function switchTool(url, name) {
      currentUrl = url;
      currentToolName.textContent = name;
      openNewTab.href = url;
      loadingOverlay.classList.remove('hidden');
      iframe.src = url;
    }

    navItems.forEach(function(item) {
      item.addEventListener('click', function() {
        navItems.forEach(function(i) { i.classList.remove('active'); });
        item.classList.add('active');
        switchTool(item.dataset.url, item.dataset.name);
      });
    });

    iframe.addEventListener('load', function() {
      loadingOverlay.classList.add('hidden');
    });

    // 5秒后强制隐藏加载遮罩
    setTimeout(function() {
      loadingOverlay.classList.add('hidden');
    }, 5000);

    refreshBtn.addEventListener('click', function() {
      loadingOverlay.classList.remove('hidden');
      iframe.src = currentUrl;
      setTimeout(function() { loadingOverlay.classList.add('hidden'); }, 3000);
    });
  })();
</script>

</body>
</html>
